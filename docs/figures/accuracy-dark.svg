<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Right product first by system and query set</title>
<rect width="860" height="620" fill="#1a1a19"/>
<text x="24.0" y="30.0" font-size="16" fill="#ffffff" font-weight="600">Right product first (hit@1), with 95% Wilson intervals</text><text x="24.0" y="50.0" font-size="12" fill="#c3c2b7">Blue rows call Jev. Dots are the median of five runs; whiskers are the interval of that run.</text><text x="24.0" y="82.0" font-size="13" fill="#ffffff" font-weight="600">Hand-written queries (n = 50, development)</text><line x1="300.0" y1="88.0" x2="300.0" y2="216.0" stroke="#383835" stroke-width="1"/><line x1="422.5" y1="88.0" x2="422.5" y2="216.0" stroke="#383835" stroke-width="1"/><line x1="545.0" y1="88.0" x2="545.0" y2="216.0" stroke="#383835" stroke-width="1"/><line x1="667.5" y1="88.0" x2="667.5" y2="216.0" stroke="#383835" stroke-width="1"/><line x1="790.0" y1="88.0" x2="790.0" y2="216.0" stroke="#383835" stroke-width="1"/><text x="288.0" y="105.0" font-size="12" fill="#c3c2b7" text-anchor="end">plain Postgres full-text search</text><line x1="488.7" y1="101.0" x2="619.5" y2="101.0" stroke="#c3c2b7" stroke-width="2"/><circle cx="554.8" cy="101.0" r="5" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/><text x="627.5" y="105.0" font-size="12" fill="#ffffff">52%</text><text x="288.0" y="131.0" font-size="12" fill="#c3c2b7" text-anchor="end">this SQL</text><line x1="639.1" y1="127.0" x2="742.1" y2="127.0" stroke="#c3c2b7" stroke-width="2"/><circle cx="701.8" cy="127.0" r="5" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/><text x="750.1" y="131.0" font-size="12" fill="#ffffff">82%</text><text x="288.0" y="157.0" font-size="12" fill="#c3c2b7" text-anchor="end">this SQL + Norvig corrector, one click</text><line x1="639.1" y1="153.0" x2="742.1" y2="153.0" stroke="#c3c2b7" stroke-width="2"/><circle cx="701.8" cy="153.0" r="5" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/><text x="750.1" y="157.0" font-size="12" fill="#ffffff">82%</text><text x="288.0" y="183.0" font-size="12" fill="#ffffff" text-anchor="end">this SQL + Jev keep or sink, as shown</text><line x1="661.7" y1="179.0" x2="755.9" y2="179.0" stroke="#3987e5" stroke-width="2"/><circle cx="721.4" cy="179.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="763.9" y="183.0" font-size="12" fill="#ffffff">86%</text><text x="288.0" y="209.0" font-size="12" fill="#ffffff" text-anchor="end">this SQL + Jev, both questions, one click</text><line x1="710.5" y1="205.0" x2="779.9" y2="205.0" stroke="#3987e5" stroke-width="2"/><circle cx="760.6" cy="205.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="787.9" y="209.0" font-size="12" fill="#ffffff">94%</text><text x="24.0" y="252.0" font-size="13" fill="#ffffff" font-weight="600">Test: synthetic one-edit misspellings and controls (n = 500)</text><line x1="300.0" y1="258.0" x2="300.0" y2="386.0" stroke="#383835" stroke-width="1"/><line x1="422.5" y1="258.0" x2="422.5" y2="386.0" stroke="#383835" stroke-width="1"/><line x1="545.0" y1="258.0" x2="545.0" y2="386.0" stroke="#383835" stroke-width="1"/><line x1="667.5" y1="258.0" x2="667.5" y2="386.0" stroke="#383835" stroke-width="1"/><line x1="790.0" y1="258.0" x2="790.0" y2="386.0" stroke="#383835" stroke-width="1"/><text x="288.0" y="275.0" font-size="12" fill="#c3c2b7" text-anchor="end">plain Postgres full-text search</text><line x1="461.1" y1="271.0" x2="502.4" y2="271.0" stroke="#c3c2b7" stroke-width="2"/><circle cx="481.3" cy="271.0" r="5" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/><text x="510.4" y="275.0" font-size="12" fill="#ffffff">37%</text><text x="288.0" y="301.0" font-size="12" fill="#c3c2b7" text-anchor="end">this SQL</text><line x1="596.5" y1="297.0" x2="637.4" y2="297.0" stroke="#c3c2b7" stroke-width="2"/><circle cx="617.5" cy="297.0" r="5" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/><text x="645.4" y="301.0" font-size="12" fill="#ffffff">65%</text><text x="288.0" y="327.0" font-size="12" fill="#c3c2b7" text-anchor="end">this SQL + Norvig corrector, one click</text><line x1="705.1" y1="323.0" x2="735.0" y2="323.0" stroke="#c3c2b7" stroke-width="2"/><circle cx="721.4" cy="323.0" r="5" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/><text x="743.0" y="327.0" font-size="12" fill="#ffffff">86%</text><text x="288.0" y="353.0" font-size="12" fill="#ffffff" text-anchor="end">this SQL + Jev keep or sink, as shown</text><line x1="622.6" y1="349.0" x2="661.9" y2="349.0" stroke="#3987e5" stroke-width="2"/><circle cx="643.0" cy="349.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="669.9" y="353.0" font-size="12" fill="#ffffff">70%</text><text x="288.0" y="379.0" font-size="12" fill="#ffffff" text-anchor="end">this SQL + Jev, both questions, one click</text><line x1="699.9" y1="375.0" x2="730.5" y2="375.0" stroke="#3987e5" stroke-width="2"/><circle cx="716.5" cy="375.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="738.5" y="379.0" font-size="12" fill="#ffffff">85%</text><text x="24.0" y="422.0" font-size="13" fill="#ffffff" font-weight="600">Test: real misspellings from Wikipedia (n = 473)</text><line x1="300.0" y1="428.0" x2="300.0" y2="556.0" stroke="#383835" stroke-width="1"/><line x1="422.5" y1="428.0" x2="422.5" y2="556.0" stroke="#383835" stroke-width="1"/><line x1="545.0" y1="428.0" x2="545.0" y2="556.0" stroke="#383835" stroke-width="1"/><line x1="667.5" y1="428.0" x2="667.5" y2="556.0" stroke="#383835" stroke-width="1"/><line x1="790.0" y1="428.0" x2="790.0" y2="556.0" stroke="#383835" stroke-width="1"/><text x="288.0" y="445.0" font-size="12" fill="#c3c2b7" text-anchor="end">plain Postgres full-text search</text><line x1="318.5" y1="441.0" x2="338.9" y2="441.0" stroke="#c3c2b7" stroke-width="2"/><circle cx="326.9" cy="441.0" r="5" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/><text x="346.9" y="445.0" font-size="12" fill="#ffffff">5%</text><text x="288.0" y="471.0" font-size="12" fill="#c3c2b7" text-anchor="end">this SQL</text><line x1="486.8" y1="467.0" x2="530.3" y2="467.0" stroke="#c3c2b7" stroke-width="2"/><circle cx="508.2" cy="467.0" r="5" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/><text x="538.3" y="471.0" font-size="12" fill="#ffffff">42%</text><text x="288.0" y="497.0" font-size="12" fill="#c3c2b7" text-anchor="end">this SQL + Norvig corrector, one click</text><line x1="593.3" y1="493.0" x2="635.4" y2="493.0" stroke="#c3c2b7" stroke-width="2"/><circle cx="614.9" cy="493.0" r="5" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/><text x="643.4" y="497.0" font-size="12" fill="#ffffff">64%</text><text x="288.0" y="523.0" font-size="12" fill="#ffffff" text-anchor="end">this SQL + Jev keep or sink, as shown</text><line x1="513.3" y1="519.0" x2="557.2" y2="519.0" stroke="#3987e5" stroke-width="2"/><circle cx="535.2" cy="519.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="565.2" y="523.0" font-size="12" fill="#ffffff">48%</text><text x="288.0" y="549.0" font-size="12" fill="#ffffff" text-anchor="end">this SQL + Jev, both questions, one click</text><line x1="626.2" y1="545.0" x2="666.2" y2="545.0" stroke="#3987e5" stroke-width="2"/><circle cx="647.0" cy="545.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="674.2" y="549.0" font-size="12" fill="#ffffff">71%</text><text x="300.0" y="584.0" font-size="11" fill="#c3c2b7" text-anchor="middle">0%</text><text x="422.5" y="584.0" font-size="11" fill="#c3c2b7" text-anchor="middle">25%</text><text x="545.0" y="584.0" font-size="11" fill="#c3c2b7" text-anchor="middle">50%</text><text x="667.5" y="584.0" font-size="11" fill="#c3c2b7" text-anchor="middle">75%</text><text x="790.0" y="584.0" font-size="11" fill="#c3c2b7" text-anchor="middle">100%</text>
