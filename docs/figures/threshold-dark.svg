<title>Spelling suggestion rates by bar</title>
<rect width="860" height="360" fill="#1a1a19"/>
<text x="24.0" y="30.0" font-size="16" fill="#ffffff" font-weight="600">Where the suggestion floor sits (post hoc)</text><text x="24.0" y="50.0" font-size="12" fill="#c3c2b7">The synthetic-test, wikipedia, synthetic-test-2 and synthetic-test-3 sets, all runs pooled, with the respelling at least 2 times as likely as the spelling typed. The page uses 0.3.</text><line x1="56.0" y1="300.0" x2="690.0" y2="300.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="304.0" font-size="11" fill="#c3c2b7" text-anchor="end">0%</text><line x1="56.0" y1="242.5" x2="690.0" y2="242.5" stroke="#383835" stroke-width="1"/><text x="48.0" y="246.5" font-size="11" fill="#c3c2b7" text-anchor="end">25%</text><line x1="56.0" y1="185.0" x2="690.0" y2="185.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="189.0" font-size="11" fill="#c3c2b7" text-anchor="end">50%</text><line x1="56.0" y1="127.5" x2="690.0" y2="127.5" stroke="#383835" stroke-width="1"/><text x="48.0" y="131.5" font-size="11" fill="#c3c2b7" text-anchor="end">75%</text><line x1="56.0" y1="70.0" x2="690.0" y2="70.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="74.0" font-size="11" fill="#c3c2b7" text-anchor="end">100%</text><text x="56.0" y="318.0" font-size="11" fill="#c3c2b7" text-anchor="middle">0.2</text><text x="140.5" y="318.0" font-size="11" fill="#c3c2b7" text-anchor="middle">0.3</text><text x="225.1" y="318.0" font-size="11" fill="#c3c2b7" text-anchor="middle">0.4</text><text x="309.6" y="318.0" font-size="11" fill="#c3c2b7" text-anchor="middle">0.5</text><text x="394.1" y="318.0" font-size="11" fill="#c3c2b7" text-anchor="middle">0.6</text><text x="478.7" y="318.0" font-size="11" fill="#c3c2b7" text-anchor="middle">0.7</text><text x="563.2" y="318.0" font-size="11" fill="#c3c2b7" text-anchor="middle">0.8</text><text x="647.7" y="318.0" font-size="11" fill="#c3c2b7" text-anchor="middle">0.9</text><text x="373.0" y="340.0" font-size="12" fill="#c3c2b7" text-anchor="middle">probability a respelling needs before it is suggested</text><line x1="140.5" y1="64.0" x2="140.5" y2="300.0" stroke="#c3c2b7" stroke-width="1"/><text x="146.5" y="74.0" font-size="11" fill="#c3c2b7">floor used</text><path d="M56.0,112.9L98.3,112.9L140.5,112.9L182.8,112.9L225.1,113.3L267.3,113.7L309.6,114.6L351.9,116.0L394.1,118.1L436.4,120.3L478.7,123.4L520.9,127.1L563.2,131.6L605.5,139.2L647.7,149.4L690.0,171.3" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="690.0" cy="171.3" r="4" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="700.0" y="175.3" font-size="12" fill="#ffffff">misspellings fixed 56%</text><circle cx="140.5" cy="112.9" r="4" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><path d="M56.0,297.6L98.3,297.6L140.5,297.6L182.8,297.6L225.1,297.6L267.3,297.6L309.6,297.6L351.9,297.6L394.1,297.6L436.4,297.6L478.7,298.1L520.9,298.5L563.2,298.6L605.5,298.9L647.7,299.5L690.0,300.0" fill="none" stroke="#d95926" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="690.0" cy="300.0" r="4" fill="#d95926" stroke="#1a1a19" stroke-width="2"/><text x="700.0" y="304.0" font-size="12" fill="#ffffff">correct words respelled 0%</text><circle cx="140.5" cy="297.6" r="4" fill="#d95926" stroke="#1a1a19" stroke-width="2"/><path d="M56.0,92.9L98.3,92.9L140.5,92.9L182.8,92.6L225.1,92.2L267.3,91.2L309.6,90.0L351.9,88.6L394.1,87.4L436.4,86.0L478.7,83.4L520.9,81.3L563.2,80.1L605.5,78.0L647.7,75.7L690.0,74.2" fill="none" stroke="#199e70" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="690.0" cy="74.2" r="4" fill="#199e70" stroke="#1a1a19" stroke-width="2"/><text x="700.0" y="78.2" font-size="12" fill="#ffffff">precision 98%</text><circle cx="140.5" cy="92.9" r="4" fill="#199e70" stroke="#1a1a19" stroke-width="2"/><line x1="56.0" y1="300.0" x2="690.0" y2="300.0" stroke="#c3c2b7" stroke-width="1"/>
