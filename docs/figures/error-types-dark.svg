<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Misspellings fixed by kind of error</title>
<rect width="860" height="360" fill="#1a1a19"/>
<text x="24.0" y="30.0" font-size="16" fill="#ffffff" font-weight="600">Misspellings fixed, by kind of error (synthetic-test, wikipedia and synthetic-test-2 sets)</text><text x="24.0" y="50.0" font-size="12" fill="#c3c2b7">A real-word error also appears in some product name, so Norvig's corrector keeps it by design. The 32 come from Wikipedia's list of common misspellings.</text><rect x="56" y="65" width="12" height="12" rx="3" fill="#3987e5"/><text x="74.0" y="75.0" font-size="12" fill="#c3c2b7">Jev (shipped options)</text><rect x="224.6" y="65" width="12" height="12" rx="3" fill="#d95926"/><text x="242.6" y="75.0" font-size="12" fill="#c3c2b7">Norvig corrector</text><rect x="360.2" y="65" width="12" height="12" rx="3" fill="#199e70"/><text x="378.2" y="75.0" font-size="12" fill="#c3c2b7">frequency rule</text><rect x="482.59999999999997" y="65" width="12" height="12" rx="3" fill="#c98500"/><text x="500.6" y="75.0" font-size="12" fill="#c3c2b7">Norvig for unknown words, else Jev (post hoc)</text><line x1="56.0" y1="290.0" x2="840.0" y2="290.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="294.0" font-size="11" fill="#c3c2b7" text-anchor="end">0%</text><line x1="56.0" y1="240.0" x2="840.0" y2="240.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="244.0" font-size="11" fill="#c3c2b7" text-anchor="end">25%</text><line x1="56.0" y1="190.0" x2="840.0" y2="190.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="194.0" font-size="11" fill="#c3c2b7" text-anchor="end">50%</text><line x1="56.0" y1="140.0" x2="840.0" y2="140.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="144.0" font-size="11" fill="#c3c2b7" text-anchor="end">75%</text><line x1="56.0" y1="90.0" x2="840.0" y2="90.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="94.0" font-size="11" fill="#c3c2b7" text-anchor="end">100%</text><path d="M205,290V150.25Q205,146.25 209,146.25H223Q227,146.25 227,150.25V290Z" fill="#3987e5"/><text x="216.0" y="140.3" font-size="11" fill="#ffffff" text-anchor="middle">72%</text><text x="240.0" y="284.0" font-size="11" fill="#ffffff" text-anchor="middle">0%</text><path d="M253,290V187.75Q253,183.75 257,183.75H271Q275,183.75 275,187.75V290Z" fill="#199e70"/><text x="264.0" y="177.8" font-size="11" fill="#ffffff" text-anchor="middle">53%</text><path d="M277,290V150.25Q277,146.25 281,146.25H295Q299,146.25 299,150.25V290Z" fill="#c98500"/><text x="288.0" y="140.3" font-size="11" fill="#ffffff" text-anchor="middle">72%</text><text x="252.0" y="310.0" font-size="12" fill="#ffffff" text-anchor="middle">real-word errors (n = 32)</text><path d="M597,290V128.39000960614794Q597,124.39000960614794 601,124.39000960614794H615Q619,124.39000960614794 619,128.39000960614794V290Z" fill="#3987e5"/><text x="608.0" y="118.4" font-size="11" fill="#ffffff" text-anchor="middle">83%</text><path d="M621,290V119.74447646493755Q621,115.74447646493755 625,115.74447646493755H639Q643,115.74447646493755 643,119.74447646493755V290Z" fill="#d95926"/><text x="632.0" y="109.7" font-size="11" fill="#ffffff" text-anchor="middle">87%</text><path d="M645,290V203.12584053794427Q645,199.12584053794427 649,199.12584053794427H663Q667,199.12584053794427 667,203.12584053794427V290Z" fill="#199e70"/><text x="656.0" y="193.1" font-size="11" fill="#ffffff" text-anchor="middle">45%</text><path d="M669,290V119.36023054755043Q669,115.36023054755043 673,115.36023054755043H687Q691,115.36023054755043 691,119.36023054755043V290Z" fill="#c98500"/><text x="680.0" y="109.4" font-size="11" fill="#ffffff" text-anchor="middle">87%</text><text x="644.0" y="310.0" font-size="12" fill="#ffffff" text-anchor="middle">non-word errors (n = 1041)</text><line x1="56.0" y1="290.0" x2="840.0" y2="290.0" stroke="#c3c2b7" stroke-width="1"/>
