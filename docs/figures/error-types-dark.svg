<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Misspellings fixed by kind of error</title>
<rect width="860" height="360" fill="#1a1a19"/>
<text x="24.0" y="30.0" font-size="16" fill="#ffffff" font-weight="600">Misspellings fixed, by kind of error (synthetic-test and wikipedia sets)</text><text x="24.0" y="50.0" font-size="12" fill="#c3c2b7">A real-word error also appears in some product name, so Norvig's corrector keeps it by design. The 32 come from Wikipedia's list of common misspellings.</text><rect x="56" y="65" width="12" height="12" rx="3" fill="#3987e5"/><text x="74.0" y="75.0" font-size="12" fill="#c3c2b7">Jev (shipped options)</text><rect x="224.6" y="65" width="12" height="12" rx="3" fill="#d95926"/><text x="242.6" y="75.0" font-size="12" fill="#c3c2b7">Norvig corrector</text><rect x="360.2" y="65" width="12" height="12" rx="3" fill="#199e70"/><text x="378.2" y="75.0" font-size="12" fill="#c3c2b7">frequency rule</text><rect x="482.59999999999997" y="65" width="12" height="12" rx="3" fill="#c98500"/><text x="500.6" y="75.0" font-size="12" fill="#c3c2b7">Norvig for unknown words, else Jev (post hoc)</text><line x1="56.0" y1="290.0" x2="840.0" y2="290.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="294.0" font-size="11" fill="#c3c2b7" text-anchor="end">0%</text><line x1="56.0" y1="240.0" x2="840.0" y2="240.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="244.0" font-size="11" fill="#c3c2b7" text-anchor="end">25%</text><line x1="56.0" y1="190.0" x2="840.0" y2="190.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="194.0" font-size="11" fill="#c3c2b7" text-anchor="end">50%</text><line x1="56.0" y1="140.0" x2="840.0" y2="140.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="144.0" font-size="11" fill="#c3c2b7" text-anchor="end">75%</text><line x1="56.0" y1="90.0" x2="840.0" y2="90.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="94.0" font-size="11" fill="#c3c2b7" text-anchor="end">100%</text><path d="M205,290V150.25Q205,146.25 209,146.25H223Q227,146.25 227,150.25V290Z" fill="#3987e5"/><text x="216.0" y="140.3" font-size="11" fill="#ffffff" text-anchor="middle">72%</text><text x="240.0" y="284.0" font-size="11" fill="#ffffff" text-anchor="middle">0%</text><path d="M253,290V187.75Q253,183.75 257,183.75H271Q275,183.75 275,187.75V290Z" fill="#199e70"/><text x="264.0" y="177.8" font-size="11" fill="#ffffff" text-anchor="middle">53%</text><path d="M277,290V150.25Q277,146.25 281,146.25H295Q299,146.25 299,150.25V290Z" fill="#c98500"/><text x="288.0" y="140.3" font-size="11" fill="#ffffff" text-anchor="middle">72%</text><text x="252.0" y="310.0" font-size="12" fill="#ffffff" text-anchor="middle">real-word errors (n = 32)</text><path d="M597,290V135.29554655870444Q597,131.29554655870444 601,131.29554655870444H615Q619,131.29554655870444 619,135.29554655870444V290Z" fill="#3987e5"/><text x="608.0" y="125.3" font-size="11" fill="#ffffff" text-anchor="middle">79%</text><path d="M621,290V121.53036437246962Q621,117.53036437246962 625,117.53036437246962H639Q643,117.53036437246962 643,121.53036437246962V290Z" fill="#d95926"/><text x="632.0" y="111.5" font-size="11" fill="#ffffff" text-anchor="middle">86%</text><path d="M645,290V207.09041835357624Q645,203.09041835357624 649,203.09041835357624H663Q667,203.09041835357624 667,207.09041835357624V290Z" fill="#199e70"/><text x="656.0" y="197.1" font-size="11" fill="#ffffff" text-anchor="middle">43%</text><path d="M669,290V120.9905533063428Q669,116.9905533063428 673,116.9905533063428H687Q691,116.9905533063428 691,120.9905533063428V290Z" fill="#c98500"/><text x="680.0" y="111.0" font-size="11" fill="#ffffff" text-anchor="middle">87%</text><text x="644.0" y="310.0" font-size="12" fill="#ffffff" text-anchor="middle">non-word errors (n = 741)</text><line x1="56.0" y1="290.0" x2="840.0" y2="290.0" stroke="#c3c2b7" stroke-width="1"/>
