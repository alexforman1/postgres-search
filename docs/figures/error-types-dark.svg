<text x="24.0" y="30.0" font-size="16" fill="#ffffff" font-weight="600">Misspellings fixed, by kind of error (held-out and synthetic sets)</text><text x="24.0" y="50.0" font-size="12" fill="#c3c2b7">A real-word error also appears in some product name, so a dictionary corrector keeps it. Median of five runs.</text><rect x="56" y="65" width="12" height="12" rx="3" fill="#3987e5"/><text x="74.0" y="75.0" font-size="12" fill="#c3c2b7">Jev (shipped options)</text><rect x="224.6" y="65" width="12" height="12" rx="3" fill="#d95926"/><text x="242.6" y="75.0" font-size="12" fill="#c3c2b7">Norvig corrector</text><rect x="360.2" y="65" width="12" height="12" rx="3" fill="#199e70"/><text x="378.2" y="75.0" font-size="12" fill="#c3c2b7">Norvig for unknown words, else Jev (post hoc)</text><line x1="56.0" y1="290.0" x2="840.0" y2="290.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="294.0" font-size="11" fill="#c3c2b7" text-anchor="end">0%</text><line x1="56.0" y1="240.0" x2="840.0" y2="240.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="244.0" font-size="11" fill="#c3c2b7" text-anchor="end">25%</text><line x1="56.0" y1="190.0" x2="840.0" y2="190.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="194.0" font-size="11" fill="#c3c2b7" text-anchor="end">50%</text><line x1="56.0" y1="140.0" x2="840.0" y2="140.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="144.0" font-size="11" fill="#c3c2b7" text-anchor="end">75%</text><line x1="56.0" y1="90.0" x2="840.0" y2="90.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="94.0" font-size="11" fill="#c3c2b7" text-anchor="end">100%</text><path d="M214,290V127.33333333333331Q214,123.33333333333331 218,123.33333333333331H234Q238,123.33333333333331 238,127.33333333333331V290Z" fill="#3987e5"/><text x="226.0" y="117.3" font-size="11" fill="#ffffff" text-anchor="middle">83%</text><text x="252.0" y="284.0" font-size="11" fill="#ffffff" text-anchor="middle">0%</text><path d="M266,290V127.33333333333331Q266,123.33333333333331 270,123.33333333333331H286Q290,123.33333333333331 290,127.33333333333331V290Z" fill="#199e70"/><text x="278.0" y="117.3" font-size="11" fill="#ffffff" text-anchor="middle">83%</text><text x="252.0" y="310.0" font-size="12" fill="#ffffff" text-anchor="middle">real-word errors (n = 18)</text><path d="M606,290V176.69230769230768Q606,172.69230769230768 610,172.69230769230768H626Q630,172.69230769230768 630,176.69230769230768V290Z" fill="#3987e5"/><text x="618.0" y="166.7" font-size="11" fill="#ffffff" text-anchor="middle">59%</text><path d="M632,290V112.58974358974359Q632,108.58974358974359 636,108.58974358974359H652Q656,108.58974358974359 656,112.58974358974359V290Z" fill="#d95926"/><text x="644.0" y="102.6" font-size="11" fill="#ffffff" text-anchor="middle">91%</text><path d="M658,290V112.58974358974359Q658,108.58974358974359 662,108.58974358974359H678Q682,108.58974358974359 682,112.58974358974359V290Z" fill="#199e70"/><text x="670.0" y="102.6" font-size="11" fill="#ffffff" text-anchor="middle">91%</text><text x="644.0" y="310.0" font-size="12" fill="#ffffff" text-anchor="middle">non-word errors (n = 312)</text><line x1="56.0" y1="290.0" x2="840.0" y2="290.0" stroke="#c3c2b7" stroke-width="1"/>
