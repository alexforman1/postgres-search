<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Misspellings fixed by kind of error</title>
<rect width="860" height="360" fill="#1a1a19"/>
<text x="24.0" y="30.0" font-size="16" fill="#ffffff" font-weight="600">Misspellings fixed, by kind of error (synthetic-test, wikipedia, synthetic-test-2 and synthetic-test-3 sets)</text><text x="24.0" y="50.0" font-size="12" fill="#c3c2b7">A real-word error also appears in some product name, so Norvig's corrector keeps it by design. The 32 come from Wikipedia's list of common misspellings.</text><rect x="56" y="65" width="12" height="12" rx="3" fill="#3987e5"/><text x="74.0" y="75.0" font-size="12" fill="#c3c2b7">Jev (shipped options)</text><rect x="224.6" y="65" width="12" height="12" rx="3" fill="#d95926"/><text x="242.6" y="75.0" font-size="12" fill="#c3c2b7">Norvig corrector</text><rect x="360.2" y="65" width="12" height="12" rx="3" fill="#199e70"/><text x="378.2" y="75.0" font-size="12" fill="#c3c2b7">frequency rule</text><rect x="482.59999999999997" y="65" width="12" height="12" rx="3" fill="#c98500"/><text x="500.6" y="75.0" font-size="12" fill="#c3c2b7">Norvig for unknown words, else Jev (post hoc)</text><line x1="56.0" y1="290.0" x2="840.0" y2="290.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="294.0" font-size="11" fill="#c3c2b7" text-anchor="end">0%</text><line x1="56.0" y1="240.0" x2="840.0" y2="240.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="244.0" font-size="11" fill="#c3c2b7" text-anchor="end">25%</text><line x1="56.0" y1="190.0" x2="840.0" y2="190.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="194.0" font-size="11" fill="#c3c2b7" text-anchor="end">50%</text><line x1="56.0" y1="140.0" x2="840.0" y2="140.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="144.0" font-size="11" fill="#c3c2b7" text-anchor="end">75%</text><line x1="56.0" y1="90.0" x2="840.0" y2="90.0" stroke="#383835" stroke-width="1"/><text x="48.0" y="94.0" font-size="11" fill="#c3c2b7" text-anchor="end">100%</text><path d="M205,290V150.25Q205,146.25 209,146.25H223Q227,146.25 227,150.25V290Z" fill="#3987e5"/><text x="216.0" y="140.3" font-size="11" fill="#ffffff" text-anchor="middle">72%</text><text x="240.0" y="284.0" font-size="11" fill="#ffffff" text-anchor="middle">0%</text><path d="M253,290V187.75Q253,183.75 257,183.75H271Q275,183.75 275,187.75V290Z" fill="#199e70"/><text x="264.0" y="177.8" font-size="11" fill="#ffffff" text-anchor="middle">53%</text><path d="M277,290V150.25Q277,146.25 281,146.25H295Q299,146.25 299,150.25V290Z" fill="#c98500"/><text x="288.0" y="140.3" font-size="11" fill="#ffffff" text-anchor="middle">72%</text><text x="252.0" y="310.0" font-size="12" fill="#ffffff" text-anchor="middle">real-word errors (n = 32)</text><path d="M597,290V130.83818046234154Q597,126.83818046234154 601,126.83818046234154H615Q619,126.83818046234154 619,130.83818046234154V290Z" fill="#3987e5"/><text x="608.0" y="120.8" font-size="11" fill="#ffffff" text-anchor="middle">82%</text><path d="M621,290V118.310216256525Q621,114.310216256525 625,114.310216256525H639Q643,114.310216256525 643,118.310216256525V290Z" fill="#d95926"/><text x="632.0" y="108.3" font-size="11" fill="#ffffff" text-anchor="middle">88%</text><path d="M645,290V201.82997762863533Q645,197.82997762863533 649,197.82997762863533H663Q667,197.82997762863533 667,201.82997762863533V290Z" fill="#199e70"/><text x="656.0" y="191.8" font-size="11" fill="#ffffff" text-anchor="middle">46%</text><path d="M669,290V118.01193139448173Q669,114.01193139448173 673,114.01193139448173H687Q691,114.01193139448173 691,118.01193139448173V290Z" fill="#c98500"/><text x="680.0" y="108.0" font-size="11" fill="#ffffff" text-anchor="middle">88%</text><text x="644.0" y="310.0" font-size="12" fill="#ffffff" text-anchor="middle">non-word errors (n = 1341)</text><line x1="56.0" y1="290.0" x2="840.0" y2="290.0" stroke="#c3c2b7" stroke-width="1"/>
