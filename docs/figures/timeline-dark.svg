<svg xmlns="http://www.w3.org/2000/svg" width="860" height="262" viewBox="0 0 860 262" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Timeline of one search</title>
<rect width="860" height="262" fill="#1a1a19"/>
<text x="24.0" y="30.0" font-size="16" fill="#ffffff" font-weight="600">What one search waits for (medians)</text><text x="24.0" y="50.0" font-size="12" fill="#c3c2b7">Both paths start when the query arrives. Orange is Postgres, blue is a Jev call; the page waits for the slower path.</text><line x1="230.0" y1="80.0" x2="230.0" y2="206.0" stroke="#383835" stroke-width="1"/><text x="230.0" y="224.0" font-size="11" fill="#c3c2b7" text-anchor="middle">0 ms</text><line x1="348.0" y1="80.0" x2="348.0" y2="206.0" stroke="#383835" stroke-width="1"/><text x="348.0" y="224.0" font-size="11" fill="#c3c2b7" text-anchor="middle">50 ms</text><line x1="466.0" y1="80.0" x2="466.0" y2="206.0" stroke="#383835" stroke-width="1"/><text x="466.0" y="224.0" font-size="11" fill="#c3c2b7" text-anchor="middle">100 ms</text><line x1="584.0" y1="80.0" x2="584.0" y2="206.0" stroke="#383835" stroke-width="1"/><text x="584.0" y="224.0" font-size="11" fill="#c3c2b7" text-anchor="middle">150 ms</text><line x1="702.0" y1="80.0" x2="702.0" y2="206.0" stroke="#383835" stroke-width="1"/><text x="702.0" y="224.0" font-size="11" fill="#c3c2b7" text-anchor="middle">200 ms</text><line x1="820.0" y1="80.0" x2="820.0" y2="206.0" stroke="#383835" stroke-width="1"/><text x="820.0" y="224.0" font-size="11" fill="#c3c2b7" text-anchor="middle">250 ms</text><text x="216.0" y="112.0" font-size="12" fill="#ffffff" text-anchor="end">search, then keep or sink</text><path d="M230,96H276.9628784000361Q280.9628784000361,96 280.9628784000361,100V114Q280.9628784000361,118 276.9628784000361,118H230Z" fill="#d95926"/><path d="M282.9628784000361,96H675.4428784000361Q679.4428784000361,96 679.4428784000361,100V114Q679.4428784000361,118 675.4428784000361,118H282.9628784000361Z" fill="#3987e5"/><text x="293.0" y="111.0" font-size="12" fill="#ffffff" font-weight="600">judge 10 results: 168 ms</text><text x="230.0" y="134.0" font-size="11" fill="#c3c2b7">search 22 ms</text><text x="216.0" y="170.0" font-size="12" fill="#ffffff" text-anchor="end">close words, then spelling</text><path d="M230,154H230Q233,154 233,157V173Q233,176 230,176H230Z" fill="#d95926"/><path d="M235,154H620.4000000000001Q624.4000000000001,154 624.4000000000001,158V172Q624.4000000000001,176 620.4000000000001,176H235Z" fill="#3987e5"/><text x="245.0" y="169.0" font-size="12" fill="#ffffff" font-weight="600">choose among 7 spellings: 165 ms</text><text x="230.0" y="192.0" font-size="11" fill="#c3c2b7">close-word lookup (2 to 22 ms in psql)</text><line x1="722.2" y1="76.0" x2="722.2" y2="210.0" stroke="#ffffff" stroke-width="1.5"/><text x="728.2" y="86.0" font-size="11" fill="#ffffff">page median 209 ms</text>
</svg>
