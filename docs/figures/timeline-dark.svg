<svg xmlns="http://www.w3.org/2000/svg" width="860" height="262" viewBox="0 0 860 262" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Timeline of one search</title>
<rect width="860" height="262" fill="#1a1a19"/>
<text x="24.0" y="30.0" font-size="16" fill="#ffffff" font-weight="600">What one search waits for (medians)</text><text x="24.0" y="50.0" font-size="12" fill="#c3c2b7">Both paths start when the query arrives. Orange is Postgres, blue is a Jev call; the page waits for the slower path.</text><line x1="230.0" y1="80.0" x2="230.0" y2="206.0" stroke="#383835" stroke-width="1"/><text x="230.0" y="224.0" font-size="11" fill="#c3c2b7" text-anchor="middle">0 ms</text><line x1="348.0" y1="80.0" x2="348.0" y2="206.0" stroke="#383835" stroke-width="1"/><text x="348.0" y="224.0" font-size="11" fill="#c3c2b7" text-anchor="middle">50 ms</text><line x1="466.0" y1="80.0" x2="466.0" y2="206.0" stroke="#383835" stroke-width="1"/><text x="466.0" y="224.0" font-size="11" fill="#c3c2b7" text-anchor="middle">100 ms</text><line x1="584.0" y1="80.0" x2="584.0" y2="206.0" stroke="#383835" stroke-width="1"/><text x="584.0" y="224.0" font-size="11" fill="#c3c2b7" text-anchor="middle">150 ms</text><line x1="702.0" y1="80.0" x2="702.0" y2="206.0" stroke="#383835" stroke-width="1"/><text x="702.0" y="224.0" font-size="11" fill="#c3c2b7" text-anchor="middle">200 ms</text><line x1="820.0" y1="80.0" x2="820.0" y2="206.0" stroke="#383835" stroke-width="1"/><text x="820.0" y="224.0" font-size="11" fill="#c3c2b7" text-anchor="middle">250 ms</text><text x="216.0" y="112.0" font-size="12" fill="#ffffff" text-anchor="end">search, then keep or sink</text><path d="M230,96H268.64351023999393Q272.64351023999393,96 272.64351023999393,100V114Q272.64351023999393,118 268.64351023999393,118H230Z" fill="#d95926"/><path d="M274.64351023999393,96H652.9635102399939Q656.9635102399939,96 656.9635102399939,100V114Q656.9635102399939,118 652.9635102399939,118H274.64351023999393Z" fill="#3987e5"/><text x="284.6" y="111.0" font-size="12" fill="#ffffff" font-weight="600">judge 10 results: 162 ms</text><text x="230.0" y="134.0" font-size="11" fill="#c3c2b7">search 18 ms</text><text x="216.0" y="170.0" font-size="12" fill="#ffffff" text-anchor="end">close words, then spelling</text><path d="M230,154H230Q233,154 233,157V173Q233,176 230,176H230Z" fill="#d95926"/><path d="M235,154H601.52Q605.52,154 605.52,158V172Q605.52,176 601.52,176H235Z" fill="#3987e5"/><text x="245.0" y="169.0" font-size="12" fill="#ffffff" font-weight="600">choose among 7 spellings: 157 ms</text><text x="230.0" y="192.0" font-size="11" fill="#c3c2b7">close-word lookup (0.8 to 5.8 ms in psql)</text><line x1="692.7" y1="76.0" x2="692.7" y2="210.0" stroke="#ffffff" stroke-width="1.5"/><text x="698.7" y="86.0" font-size="11" fill="#ffffff">page median 196 ms</text>
</svg>
