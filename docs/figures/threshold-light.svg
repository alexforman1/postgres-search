efore it is suggested</text><line x1="140.5" y1="64.0" x2="140.5" y2="300.0" stroke="#52514e" stroke-width="1"/><text x="146.5" y="74.0" font-size="11" fill="#52514e">floor used</text><path d="M56.0,111.1L98.3,111.1L140.5,111.1L182.8,111.5L225.1,112.0L267.3,112.9L309.6,114.4L351.9,116.1L394.1,118.0L436.4,120.3L478.7,123.7L520.9,127.4L563.2,132.1L605.5,139.4L647.7,152.2L690.0,177.1" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="690.0" cy="177.1" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="700.0" y="181.1" font-size="12" fill="#0b0b0b">misspellings fixed 53%</text><circle cx="140.5" cy="111.1" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><path d="M56.0,298.6L98.3,298.6L140.5,298.6L182.8,298.6L225.1,298.6L267.3,298.6L309.6,298.6L351.9,298.6L394.1,298.6L436.4,298.8L478.7,299.0L520.9,299.5L563.2,299.6L605.5,299.9L647.7,300.0L690.0,300.0" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="690.0" cy="300.0" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="700.0" y="304.0" font-size="12" fill="#0b0b0b">correct words respelled 0%</text><circle cx="140.5" cy="298.6" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><path d="M56.0,94.1L98.3,94.1L140.5,94.0L182.8,93.5L225.1,92.6L267.3,91.8L309.6,90.7L351.9,89.1L394.1,87.5L436.4,85.8L478.7,83.7L520.9,81.8L563.2,80.0L605.5,77.6L647.7,76.0L690.0,74.0" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="690.0" cy="74.0" r="4" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="700.0" y="78.0" font-size="12" fill="#0b0b0b">precision 98%</text><circle cx="140.5" cy="94.0" r="4" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><line x1="56.0" y1="300.0" x2="690.0" y2="300.0" stroke="#52514e" stroke-width="1"/>
