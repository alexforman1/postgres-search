d</text><line x1="140.5" y1="64.0" x2="140.5" y2="300.0" stroke="#52514e" stroke-width="1"/><text x="146.5" y="74.0" font-size="11" fill="#52514e">floor used</text><path d="M56.0,110.3L98.3,110.3L140.5,110.3L182.8,110.5L225.1,110.7L267.3,110.9L309.6,112.7L351.9,113.5L394.1,115.4L436.4,118.2L478.7,121.4L520.9,125.1L563.2,130.2L605.5,138.2L647.7,150.8L690.0,174.8" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="690.0" cy="174.8" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="700.0" y="178.8" font-size="12" fill="#0b0b0b">misspellings fixed 54%</text><circle cx="140.5" cy="110.3" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><path d="M56.0,298.3L98.3,298.3L140.5,298.3L182.8,298.3L225.1,298.3L267.3,298.3L309.6,298.3L351.9,298.3L394.1,298.3L436.4,298.3L478.7,298.3L520.9,298.3L563.2,298.3L605.5,298.9L647.7,299.4L690.0,300.0" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="690.0" cy="300.0" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="700.0" y="304.0" font-size="12" fill="#0b0b0b">correct words respelled 0%</text><circle cx="140.5" cy="298.3" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><path d="M56.0,97.9L98.3,97.9L140.5,97.9L182.8,97.5L225.1,96.3L267.3,94.5L309.6,92.8L351.9,91.1L394.1,90.4L436.4,88.5L478.7,85.2L520.9,83.3L563.2,81.6L605.5,78.2L647.7,76.4L690.0,75.0" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="690.0" cy="75.0" r="4" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="700.0" y="79.0" font-size="12" fill="#0b0b0b">precision 98%</text><circle cx="140.5" cy="97.9" r="4" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><line x1="56.0" y1="300.0" x2="690.0" y2="300.0" stroke="#52514e" stroke-width="1"/>
