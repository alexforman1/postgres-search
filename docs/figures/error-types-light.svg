<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Misspellings fixed by kind of error</title>
<rect width="860" height="360" fill="#fcfcfb"/>
<text x="24.0" y="30.0" font-size="16" fill="#0b0b0b" font-weight="600">Misspellings fixed, by kind of error (synthetic-test, wikipedia and synthetic-test-2 to synthetic-test-5 sets)</text><text x="24.0" y="50.0" font-size="12" fill="#52514e">A real-word error also appears in some product name, so Norvig's corrector keeps it by design. The 32 come from Wikipedia's list of common misspellings.</text><rect x="56" y="65" width="12" height="12" rx="3" fill="#2a78d6"/><text x="74.0" y="75.0" font-size="12" fill="#52514e">Jev (shipped options)</text><rect x="224.6" y="65" width="12" height="12" rx="3" fill="#eb6834"/><text x="242.6" y="75.0" font-size="12" fill="#52514e">Norvig corrector</text><rect x="360.2" y="65" width="12" height="12" rx="3" fill="#1baf7a"/><text x="378.2" y="75.0" font-size="12" fill="#52514e">frequency rule</text><rect x="482.59999999999997" y="65" width="12" height="12" rx="3" fill="#eda100"/><text x="500.6" y="75.0" font-size="12" fill="#52514e">Norvig for unknown words, else Jev (post hoc)</text><line x1="56.0" y1="290.0" x2="840.0" y2="290.0" stroke="#e4e3df" stroke-width="1"/><text x="48.0" y="294.0" font-size="11" fill="#52514e" text-anchor="end">0%</text><line x1="56.0" y1="240.0" x2="840.0" y2="240.0" stroke="#e4e3df" stroke-width="1"/><text x="48.0" y="244.0" font-size="11" fill="#52514e" text-anchor="end">25%</text><line x1="56.0" y1="190.0" x2="840.0" y2="190.0" stroke="#e4e3df" stroke-width="1"/><text x="48.0" y="194.0" font-size="11" fill="#52514e" text-anchor="end">50%</text><line x1="56.0" y1="140.0" x2="840.0" y2="140.0" stroke="#e4e3df" stroke-width="1"/><text x="48.0" y="144.0" font-size="11" fill="#52514e" text-anchor="end">75%</text><line x1="56.0" y1="90.0" x2="840.0" y2="90.0" stroke="#e4e3df" stroke-width="1"/><text x="48.0" y="94.0" font-size="11" fill="#52514e" text-anchor="end">100%</text><path d="M205,290V150.25Q205,146.25 209,146.25H223Q227,146.25 227,150.25V290Z" fill="#2a78d6"/><text x="216.0" y="140.3" font-size="11" fill="#0b0b0b" text-anchor="middle">72%</text><text x="240.0" y="284.0" font-size="11" fill="#0b0b0b" text-anchor="middle">0%</text><path d="M253,290V187.75Q253,183.75 257,183.75H271Q275,183.75 275,187.75V290Z" fill="#1baf7a"/><text x="264.0" y="177.8" font-size="11" fill="#0b0b0b" text-anchor="middle">53%</text><path d="M277,290V150.25Q277,146.25 281,146.25H295Q299,146.25 299,150.25V290Z" fill="#eda100"/><text x="288.0" y="140.3" font-size="11" fill="#0b0b0b" text-anchor="middle">72%</text><text x="252.0" y="310.0" font-size="12" fill="#0b0b0b" text-anchor="middle">real-word errors (n = 32)</text><path d="M597,290V129.65172591447708Q597,125.65172591447708 601,125.65172591447708H615Q619,125.65172591447708 619,129.65172591447708V290Z" fill="#2a78d6"/><text x="608.0" y="119.7" font-size="11" fill="#0b0b0b" text-anchor="middle">82%</text><path d="M621,290V117.59608449252963Q621,113.59608449252963 625,113.59608449252963H639Q643,113.59608449252963 643,117.59608449252963V290Z" fill="#eb6834"/><text x="632.0" y="107.6" font-size="11" fill="#0b0b0b" text-anchor="middle">88%</text><path d="M645,290V198.688304997424Q645,194.688304997424 649,194.688304997424H663Q667,194.688304997424 667,198.688304997424V290Z" fill="#1baf7a"/><text x="656.0" y="188.7" font-size="11" fill="#0b0b0b" text-anchor="middle">48%</text><path d="M669,290V117.3900051519835Q669,113.3900051519835 673,113.3900051519835H687Q691,113.3900051519835 691,117.3900051519835V290Z" fill="#eda100"/><text x="680.0" y="107.4" font-size="11" fill="#0b0b0b" text-anchor="middle">88%</text><text x="644.0" y="310.0" font-size="12" fill="#0b0b0b" text-anchor="middle">non-word errors (n = 1941)</text><line x1="56.0" y1="290.0" x2="840.0" y2="290.0" stroke="#52514e" stroke-width="1"/>
</svg>
