<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Right product first by system and query set</title>
<rect width="860" height="620" fill="#fcfcfb"/>
<text x="24.0" y="30.0" font-size="16" fill="#0b0b0b" font-weight="600">Right product first (hit@1), with 95% Wilson intervals</text><text x="24.0" y="50.0" font-size="12" fill="#52514e">Blue rows call Jev. Dots are the median of five runs; whiskers are the interval of that run.</text><text x="24.0" y="82.0" font-size="13" fill="#0b0b0b" font-weight="600">Clean test: synthetic one-edit misspellings and controls (n = 500)</text><line x1="300.0" y1="88.0" x2="300.0" y2="216.0" stroke="#e4e3df" stroke-width="1"/><line x1="422.5" y1="88.0" x2="422.5" y2="216.0" stroke="#e4e3df" stroke-width="1"/><line x1="545.0" y1="88.0" x2="545.0" y2="216.0" stroke="#e4e3df" stroke-width="1"/><line x1="667.5" y1="88.0" x2="667.5" y2="216.0" stroke="#e4e3df" stroke-width="1"/><line x1="790.0" y1="88.0" x2="790.0" y2="216.0" stroke="#e4e3df" stroke-width="1"/><text x="288.0" y="105.0" font-size="12" fill="#52514e" text-anchor="end">plain Postgres full-text search</text><line x1="452.6" y1="101.0" x2="493.5" y2="101.0" stroke="#52514e" stroke-width="2"/><circle cx="472.5" cy="101.0" r="5" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/><text x="501.5" y="105.0" font-size="12" fill="#0b0b0b">35%</text><text x="288.0" y="131.0" font-size="12" fill="#52514e" text-anchor="end">this SQL</text><line x1="584.6" y1="127.0" x2="626.0" y2="127.0" stroke="#52514e" stroke-width="2"/><circle cx="605.8" cy="127.0" r="5" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/><text x="634.0" y="131.0" font-size="12" fill="#0b0b0b">62%</text><text x="288.0" y="157.0" font-size="12" fill="#52514e" text-anchor="end">this SQL + Norvig corrector, one click</text><line x1="688.3" y1="153.0" x2="720.7" y2="153.0" stroke="#52514e" stroke-width="2"/><circle cx="705.7" cy="153.0" r="5" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/><text x="728.7" y="157.0" font-size="12" fill="#0b0b0b">83%</text><text x="288.0" y="183.0" font-size="12" fill="#0b0b0b" text-anchor="end">this SQL + Jev keep or sink, as shown</text>